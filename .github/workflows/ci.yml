name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Matches requires-python = ">=3.10" in pyproject.toml.
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Test
        # No network and no API key: the agent tests run against a fake client.
        run: python -m pytest -q

      - name: Smoke-test the CLI
        run: |
          export TITAN_HOME="$(mktemp -d)"
          titan doctor
          titan init
          titan memory list
